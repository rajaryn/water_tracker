<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Hydration Companion</title>
  
  <meta name="theme-color" content="#F7F7F2" />
  <meta name="description" content="A calm, physical-first hydration companion designed for daily wellbeing." />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />

  <link rel="manifest" href="/manifest.json" />
  <link rel="apple-touch-icon" href="/icons/icon-192.png" />
  <link rel="stylesheet" href="/css/app.css" />
</head>
<body>

  <div class="app-shell">
    <!-- App Content Screens -->
    <main class="app-content">

      <!-- Onboarding Screen -->
      <section id="screen-onboarding" class="screen">
        <div class="onboarding-container" id="onboardingCardContainer">
          <!-- Dynamic Onboarding Cards rendered via app.js -->
        </div>
      </section>

      <!-- Today Screen (Hero Animated Physical Bottle) -->
      <section id="screen-today" class="screen">
        <div class="hero-bottle-section">
          <div class="daily-summary-header">
            <div class="greeting-text" id="todayGreeting">Good morning</div>
            <div class="consumed-amount-row">
              <span class="consumed-amount" id="homeConsumedVal">0.00 L</span>
              <span class="target-amount-sub">of <span id="homeTargetVal">2.50 L</span> today</span>
            </div>
            
            <!-- Quiet Linear Progress Indicator -->
            <div class="linear-progress-track">
              <div class="linear-progress-fill" id="homeProgressBar"></div>
            </div>
          </div>

          <!-- Atmospheric Ambient Shape Backdrop -->
          <div class="bottle-ambient-backdrop"></div>

          <!-- Hero Physical Animated Bottle Container -->
          <div class="bottle-container-widget" id="bottleWidgetContainer"></div>
        </div>

        <!-- Quick Drink Actions -->
        <div class="quick-drink-section">
          <div class="drink-buttons-grid">
            <button class="btn-drink" data-amount="100">
              <span>+100</span>
              <span class="btn-sub">ml</span>
            </button>
            <button class="btn-drink" data-amount="200">
              <span>+200</span>
              <span class="btn-sub">ml</span>
            </button>
            <button class="btn-drink" data-amount="250">
              <span>+250</span>
              <span class="btn-sub">ml</span>
            </button>
            <button class="btn-drink" data-amount="500">
              <span>+500</span>
              <span class="btn-sub">ml</span>
            </button>
          </div>

          <div class="action-row-secondary">
            <button class="btn btn-secondary" id="customDrinkBtn">
              <svg class="btn-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"/></svg>
              <span>Custom amount</span>
            </button>
          </div>

          <!-- Refill Action Button -->
          <button class="btn btn-refill" id="refillBottleBtn">
            <svg class="btn-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21.5 2v6h-6M21.34 15.57a10 10 0 1 1-.57-8.38l5.67-5.67"/></svg>
            <span>Refill bottle</span>
          </button>
        </div>

        <!-- Vessels Section (Gulp & Glass) -->
        <div class="vessels-section">
          <div id="gulpWidgetContainer"></div>
          <div id="glassWidgetContainer"></div>
        </div>
      </section>

      <!-- History Screen -->
      <section id="screen-history" class="screen">
        <div class="screen-header">
          <h2 class="screen-title">History</h2>
          <p class="screen-subtitle">Your calm timeline of hydration</p>
        </div>
        <div id="historyContainer"></div>
      </section>

      <!-- Insights Screen -->
      <section id="screen-insights" class="screen">
        <div class="screen-header">
          <h2 class="screen-title">Insights</h2>
          <p class="screen-subtitle">Your weekly hydration rhythm</p>
        </div>
        <div id="statsContainer"></div>
      </section>

      <!-- You / Settings Screen -->
      <section id="screen-you" class="screen">
        <div class="screen-header">
          <h2 class="screen-title">You</h2>
          <p class="screen-subtitle">Preferences and bottle configuration</p>
        </div>
        <div id="settingsContainer"></div>
      </section>

    </main>

    <!-- Bottom Navigation Bar (Section 19: Today, History, Insights, You) -->
    <nav class="app-navbar">
      <button class="nav-item active" data-screen="today">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2.69l5.66 5.66a8 8 0 1 1-11.31 0z"/></svg>
        <span>Today</span>
      </button>

      <button class="nav-item" data-screen="history">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
        <span>History</span>
      </button>

      <button class="nav-item" data-screen="insights">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/></svg>
        <span>Insights</span>
      </button>

      <button class="nav-item" data-screen="you">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
        <span>You</span>
      </button>
    </nav>
  </div>

  <!-- Main ES Module script -->
  <script type="module" src="/js/app.js"></script>
</body>
</html>
