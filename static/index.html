<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Hydration Companion - Physical Water Bottle Tracker</title>
  
  <meta name="theme-color" content="#0ea5e9" />
  <meta name="description" content="Research-based mobile-first hydration tracker PWA featuring a living physical water bottle visualization." />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />

  <link rel="manifest" href="/manifest.json" />
  <link rel="apple-touch-icon" href="/icons/icon-192.png" />
  <link rel="stylesheet" href="/css/app.css" />
</head>
<body>

  <div class="app-shell">
    <!-- App Content Screens -->
    <main class="app-content">

      <!-- Onboarding Screen -->
      <section id="screen-onboarding" class="screen">
        <div class="onboarding-container" id="onboardingCardContainer">
          <!-- Dynamic Onboarding Cards rendered via app.js -->
        </div>
      </section>

      <!-- Home Screen (Main Physical Bottle Dashboard) -->
      <section id="screen-home" class="screen">
        <div class="hero-bottle-section">
          <div class="daily-summary-header">
            <div class="greeting-text">Today's Hydration</div>
            <div class="consumed-amount" id="homeConsumedVal">0.00 L</div>
            <div class="target-amount-sub">Target: <span id="homeTargetVal">2.50 L</span></div>
            
            <!-- Linear Progress Bar for Daily Hydration -->
            <div class="linear-progress-track">
              <div class="linear-progress-fill" id="homeProgressBar"></div>
            </div>
          </div>

          <!-- Hero Physical Animated Bottle Container -->
          <div class="bottle-container-widget" id="bottleWidgetContainer"></div>
        </div>

        <!-- Quick Drink Actions -->
        <div class="quick-drink-section">
          <div class="section-label">Quick Log Water</div>
          <div class="drink-buttons-grid">
            <button class="btn-drink" data-amount="100">
              <span>+100</span>
              <span class="btn-sub">ml</span>
            </button>
            <button class="btn-drink" data-amount="200">
              <span>+200</span>
              <span class="btn-sub">ml</span>
            </button>
            <button class="btn-drink" data-amount="250">
              <span>+250</span>
              <span class="btn-sub">ml</span>
            </button>
            <button class="btn-drink" data-amount="500">
              <span>+500</span>
              <span class="btn-sub">ml</span>
            </button>
          </div>

          <div class="action-row-secondary">
            <button class="btn btn-secondary" id="customDrinkBtn">
              ✏️ Custom Amount
            </button>
          </div>

          <!-- Refill Action Button -->
          <button class="btn btn-refill" id="refillBottleBtn">
            ↻ Refill Bottle
          </button>
        </div>

        <!-- Separate Gulp Vessel Section -->
        <div id="gulpWidgetContainer"></div>

        <!-- Glass Vessel Visualizer Section -->
        <div id="glassWidgetContainer"></div>
      </section>

      <!-- History Screen -->
      <section id="screen-history" class="screen">
        <h2 style="font-size:1.4rem; font-weight:800; margin-bottom:15px;">Drinking History</h2>
        <div id="historyContainer"></div>
      </section>

      <!-- Statistics Screen -->
      <section id="screen-stats" class="screen">
        <h2 style="font-size:1.4rem; font-weight:800; margin-bottom:15px;">Hydration Analytics</h2>
        <div id="statsContainer"></div>
      </section>

      <!-- "Why this target?" Methodology Screen -->
      <section id="screen-methodology" class="screen">
        <div id="methodologyContainer"></div>
      </section>

      <!-- Settings Screen -->
      <section id="screen-settings" class="screen">
        <h2 style="font-size:1.4rem; font-weight:800; margin-bottom:15px;">Settings</h2>
        <div id="settingsContainer"></div>
      </section>

    </main>

    <!-- Bottom Navigation Bar -->
    <nav class="app-navbar">
      <button class="nav-item active" data-screen="home">
        <svg viewBox="0 0 24 24"><path d="M12 2.69l5.66 5.66a8 8 0 1 1-11.31 0z"/></svg>
        <span>Bottle</span>
      </button>

      <button class="nav-item" data-screen="history">
        <svg viewBox="0 0 24 24"><path d="M13 3a9 9 0 0 0-9 9H1l3.89 3.89.07.14L9 12H6a7 7 0 1 1 7 7 7.07 7.07 0 0 1-6-3.42l-1.42 1.42A8.91 8.91 0 0 0 13 21a9 9 0 0 0 0-18zm-1 5v5l4.28 2.54.72-1.21-3.5-2.08V8z"/></svg>
        <span>History</span>
      </button>

      <button class="nav-item" data-screen="stats">
        <svg viewBox="0 0 24 24"><path d="M5 9.2h3V19H5zM10.6 5h2.8v14h-2.8zM16.2 13H19v6h-2.8z"/></svg>
        <span>Stats</span>
      </button>

      <button class="nav-item" data-screen="methodology">
        <svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 15h-2v-6h2v6zm0-8h-2V7h2v2z"/></svg>
        <span>Science</span>
      </button>

      <button class="nav-item" data-screen="settings">
        <svg viewBox="0 0 24 24"><path d="M19.14 12.94c.04-.3.06-.61.06-.94 0-.32-.02-.64-.07-.94l2.03-1.58a.49.49 0 0 0 .12-.61l-1.92-3.32a.488.488 0 0 0-.59-.22l-2.39.96c-.5-.38-1.03-.7-1.62-.94l-.36-2.54a.484.484 0 0 0-.48-.41h-3.84c-.24 0-.43.17-.47.41l-.36 2.54c-.59.24-1.13.57-1.62.94l-2.39-.96a.488.488 0 0 0-.59.22L2.74 8.87c-.12.21-.08.47.12.61l2.03 1.58c-.05.3-.09.63-.09.94s.02.64.07.94l-2.03 1.58a.49.49 0 0 0-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.05.24.24.41.48.41h3.84c.24 0 .44-.17.47-.41l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32c.12-.22.07-.47-.12-.61l-2.01-1.58zM12 15.6c-1.98 0-3.6-1.62-3.6-3.6s1.62-3.6 3.6-3.6 3.6 1.62 3.6 3.6-1.62 3.6-3.6 3.6z"/></svg>
        <span>Settings</span>
      </button>
    </nav>
  </div>

  <!-- Main ES Module script -->
  <script type="module" src="/js/app.js"></script>
</body>
</html>
